trigger:
  branches:
    include: [main]
  paths:
    include: [src/*, Dockerfile, pyproject.toml, uv.lock]

variables:
  - group: neon-secrets
  - name: IMAGE_NAME
    value: $(ACR_NAME).azurecr.io/neon-api

stages:

  - stage: Test
    displayName: Test
    jobs:
      - job: test
        displayName: Lint and test
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.13'
          - script: pip install uv && uv sync --group dev
            displayName: Install dependencies
          - script: uv run ruff check .
            displayName: Lint
          - script: uv run pytest tests/ -q
            displayName: Tests

  - stage: Build
    displayName: Build and push
    dependsOn: Test
    jobs:
      - job: build
        displayName: Docker build and push
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: AzureCLI@2
            displayName: Login to ACR
            inputs:
              azureSubscription: neon-service-connection
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: az acr login --name $(ACR_NAME)
          - script: |
              docker build \
                -t $(IMAGE_NAME):$(Build.BuildId) \
                -t $(IMAGE_NAME):latest \
                .
            displayName: Build image
          - script: |
              docker push $(IMAGE_NAME):$(Build.BuildId)
              docker push $(IMAGE_NAME):latest
            displayName: Push image

  - stage: Deploy
    displayName: Deploy
    dependsOn: Build
    jobs:
      - job: deploy
        displayName: Update Container App
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: AzureCLI@2
            displayName: Deploy to Container Apps
            inputs:
              azureSubscription: neon-service-connection
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az containerapp update \
                  --name neon-api \
                  --resource-group rg-neon \
                  --image $(IMAGE_NAME):$(Build.BuildId) \
                  --set-env-vars \
                    FRED_API_KEY=$(FRED_API_KEY) \
                    ALPHA_VANTAGE_API_KEY=$(ALPHA_VANTAGE_API_KEY) \
                    ALLOWED_ORIGINS=$(ALLOWED_ORIGINS)
          - script: |
              FQDN=$(az containerapp show \
                --name neon-api \
                --resource-group rg-neon \
                --query properties.configuration.ingress.fqdn \
                --output tsv)
              curl --fail "https://${FQDN}/health"
            displayName: Smoke test
            env:
              AZURE_DEFAULTS_GROUP: rg-neon
