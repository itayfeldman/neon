trigger:
  branches:
    include: [main]
  paths:
    include: [dashboard/*]

variables:
  - group: neon-secrets

stages:

  - stage: Build
    displayName: Build
    jobs:
      - job: build
        displayName: npm build
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '22.x'
            displayName: Use Node 22
          - script: npm ci
            displayName: Install dependencies
            workingDirectory: dashboard
          - script: npm run build
            displayName: Build SPA
            workingDirectory: dashboard
          - publish: dashboard/dist
            artifact: spa-dist
            displayName: Publish dist artifact

  - stage: Deploy
    displayName: Deploy
    dependsOn: Build
    jobs:
      - job: deploy
        displayName: Deploy to Static Web Apps
        pool:
          vmImage: ubuntu-latest
        steps:
          - download: current
            artifact: spa-dist
          - task: AzureStaticWebApp@0
            displayName: Deploy SPA
            inputs:
              azure_static_web_apps_api_token: $(AZURE_STATIC_WEB_APPS_API_TOKEN)
              app_location: $(Pipeline.Workspace)/spa-dist
              skip_app_build: true
              output_location: ''
